name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y jq
      - run: node bin/lint-contexto.mjs
      - run: node docs/guia-de-desenvolvimento/checar.mjs
      - run: npm test
